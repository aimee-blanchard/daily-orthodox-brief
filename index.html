<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Orthodox Brief</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="fasting.css">
<link rel="stylesheet" href="catechism.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060606">
<style>
  :root {
    --bg: #060606;
    --cross: #161616;
    --ink: #f7f4ec;
    --ink-soft: #cbc6b8;
    --ink-faint: #8f897a;
    --rule: #302f2c;
    --accent: #d99a6c;
    --card-bg: #1c1c1a;
    --warn-bg: #2c2314;
    --warn-ink: #e0b878;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
  }
  #bg-cross {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(65vw, 420px);
    height: 88vh;
    z-index: 0;
    pointer-events: none;
  }
  #bg-cross .cross-shape { fill: var(--cross); }
  a { color: var(--accent); }
  main {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 1.75rem 1.25rem 4rem;
  }
  @media (orientation: landscape) {
    main { max-width: 94vw; }
  }

  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .nav-btn {
    appearance: none;
    border: none;
    background: none;
    color: var(--ink);
    font-size: 1.5rem;
    line-height: 1;
    padding: 0.5rem 0.75rem;
    cursor: pointer;
    border-radius: 8px;
  }
  .nav-btn:disabled { color: var(--rule); cursor: default; }
  .nav-btn:not(:disabled):active { background: var(--rule); }

  .date-heading {
    text-align: center;
    flex: 1;
    appearance: none;
    background: none;
    border: none;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
    padding: 0.25rem 0.5rem;
    border-radius: 10px;
  }
  .date-heading:active, .date-heading[aria-expanded="true"] { background: #1c1c1a; }
  .date-caret { font-size: 0.7em; color: var(--accent); vertical-align: 0.15em; }
  .date-picker {
    position: relative;
    z-index: 5;
    background: var(--card-bg);
    border: 1px solid var(--accent);
    border-radius: 14px;
    padding: 0.9rem 1rem;
    margin: -0.75rem 0 1.25rem;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.6);
  }
  .date-picker[hidden] { display: none; }
  .date-picker-row { display: grid; grid-template-columns: 1fr 1.6fr 1.3fr; gap: 0.5rem; }
  .date-picker label span {
    display: block;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 0.25rem;
  }
  .date-picker select {
    width: 100%;
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 0.55rem 0.45rem;
    font-size: 1rem;
    font-family: var(--sans);
  }
  .date-picker-actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
  .date-picker-actions button {
    flex: 1;
    appearance: none;
    border-radius: 8px;
    padding: 0.6rem;
    font-size: 0.95rem;
    font-family: var(--sans);
    cursor: pointer;
  }
  .dp-today { background: none; border: 1px solid var(--rule); color: var(--ink); }
  .dp-go { background: var(--accent); border: 1px solid var(--accent); color: #1c1c1a; font-weight: 700; }
  .date-heading .weekday {
    display: block;
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 0.15rem;
  }
  .date-heading .date {
    display: block;
    font-family: var(--serif);
    font-size: 1.4rem;
  }
  .today-btn {
    display: block;
    margin: -0.75rem auto 1.5rem;
    text-align: center;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 0.85rem;
    cursor: pointer;
  }

  section.card {
    background: var(--card-bg);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 1rem;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  section.card h2 {
    margin: 0 0 0.6rem;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
  }

  .feast-title {
    font-family: var(--serif);
    font-size: 1.3rem;
    margin: 0;
  }

  .great-feast-badge {
    margin: 0 0 0.5rem;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .summary-title {
    font-family: var(--serif);
    font-size: 1.05rem;
    color: var(--ink-soft);
    margin: 0 0 0.75rem;
  }

  .synaxarion-panel { margin-top: 0.5rem; }

  /* Collapsible sections: a thin bar with a chevron; the open body scrolls
     inside itself and stops just short of the screen height. */
  section.card.cs { padding: 0; }
  .cs-bar {
    appearance: none; display: flex; align-items: center; gap: 0.6rem; width: 100%;
    background: var(--card-bg); border: none; border-radius: 14px; color: var(--ink);
    padding: 0.5rem 0.75rem 0.5rem 1.25rem; text-align: left; cursor: pointer; font-family: var(--sans);
    position: sticky; top: 0; z-index: 3;
  }
  .cs.open > .cs-bar { border-radius: 14px 14px 0 0; border-bottom: 1px solid var(--rule); }
  .cs-bar:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cs-titles { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .cs-title { font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; }
  .cs-meta { font-size: 0.85rem; color: var(--ink-soft); margin-top: 0.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cs-meta:empty { display: none; }
  .cs-highlight .cs-title { color: var(--accent); }
  .cs-chevron {
    flex-shrink: 0; width: 1.9rem; height: 1.9rem; border-radius: 50%; border: 1px solid var(--rule);
    display: flex; align-items: center; justify-content: center; color: var(--accent);
  }
  .cs-chevron::before {
    content: ""; width: 0.5rem; height: 0.5rem; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: translateY(-0.12rem) rotate(45deg); transition: transform 0.2s;
  }
  .cs.open .cs-chevron::before { transform: translateY(0.12rem) rotate(-135deg); }
  .cs-body {
    max-height: calc(100vh - 80px);
    max-height: calc(100dvh - 80px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    /* Let a swipe that reaches the end of the box carry on scrolling the page
       (like the old service-text panel), so she can move on to other sections.
       Only sideways overscroll is contained. */
    overscroll-behavior-x: contain;
    overscroll-behavior-y: auto;
    scrollbar-color: #ffffff transparent;
    padding: 0.8rem 1.25rem 1.1rem;
  }
  .cs-body[hidden] { display: none; }
  /* Pinned footer under a section's scroll box (Service Texts notes). */
  .cs-foot {
    position: sticky; bottom: 0; z-index: 3;
    background: var(--card-bg); border-top: 1px solid var(--rule);
    border-radius: 0 0 14px 14px; padding: 0.55rem 1.25rem calc(0.6rem + env(safe-area-inset-bottom));
  }
  .cs:not(.open) > .cs-foot { display: none; }
  .svc-foot:not(:has(.svc-notes)):has(.anchored-summary[hidden]) { display: none; }
  .cs[data-cs="services"] > .cs-body { max-height: calc(100vh - 80px - 3.6rem); max-height: calc(100dvh - 80px - 3.6rem); }
  .cs[data-cs="services"].notes-open > .cs-body { max-height: calc(100vh - 80px - 17rem); max-height: calc(100dvh - 80px - 17rem); }
  .svc-notes-row { display: flex; align-items: center; gap: 0.6rem; }
  .svc-notes-toggle {
    flex: 1; appearance: none; background: none; border: none; padding: 0.35rem 0; cursor: pointer; text-align: left;
    color: var(--ink); font-family: var(--sans); font-size: 0.9rem; display: flex; align-items: center; gap: 0.45rem;
  }
  .svc-notes-chev { width: 0.45rem; height: 0.45rem; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: translateY(0.1rem) rotate(-135deg); transition: transform 0.2s; }
  .svc-notes-toggle[aria-expanded="true"] .svc-notes-chev { transform: translateY(-0.1rem) rotate(45deg); }
  .svc-notes-row .notes-doxy { width: auto; margin: 0; flex-shrink: 0; }
  .svc-notes-panel { padding-top: 0.5rem; }
  .svc-notes-panel .notes-textarea { min-height: 7rem; }
  .svc-foot .anchored-summary { margin-top: 0; padding-top: 0; border-top: none; }
  .svc-notes + .anchored-summary:not([hidden]) { margin-top: 0.35rem; font-size: 0.8rem; }
  .cs-body::-webkit-scrollbar { width: 8px; }
  .cs-body::-webkit-scrollbar-track { background: transparent; }
  .cs-body::-webkit-scrollbar-thumb { background-color: #ffffff; border-radius: 8px; }
  /* Inside a collapsible the section body is the one scroller (no nested scroll boxes). */
  .cs-body .service-text-panel { max-height: none; overflow: visible; }
  /* Sticky headers inside the scroll box sit flush with its top edge; the shadow
     covers the box's top padding so text doesn't peek through above them. */
  .cs-body .checkable-header { top: -0.8rem; box-shadow: 0 -0.8rem 0 var(--card-bg); }
  .cs-body .text-switch ~ .service-text-scroll .checkable-header { top: calc(-0.8rem + var(--switch-h, 0px)); box-shadow: none; }

  .na-section { margin-top: 1rem; padding-top: 0.8rem; border-top: 1px solid var(--rule); }
  .na-heading { margin: 0 0 0.6rem; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; }
  .na-bio { margin-bottom: 0.9rem; }
  .na-bio summary { list-style: none; cursor: pointer; }
  .na-bio summary::-webkit-details-marker { display: none; }
  .na-title { display: block; font-weight: 600; font-size: 0.95rem; margin-bottom: 0.25rem; }
  .na-excerpt { display: block; font-family: var(--serif); font-size: 1.02rem; line-height: 1.55; color: var(--ink-soft); }
  .na-bio[open] .na-excerpt { display: none; }
  .na-more { display: inline-block; margin-top: 0.3rem; font-size: 0.85rem; color: var(--accent); }
  .na-bio[open] .na-more { display: none; }
  .na-full { font-family: var(--serif); font-size: 1.02rem; line-height: 1.6; color: var(--ink-soft); }
  .na-full p { margin: 0 0 0.6rem; }
  .na-bio { scroll-margin-top: 0.75rem; }
  .na-less { display: block; margin: 0 0 0.35rem; padding: 0; border: none; background: none; font: inherit; font-size: 0.85rem; color: var(--accent); cursor: pointer; }
  .na-link { display: inline-block; margin-top: 0.3rem; font-size: 0.85rem; }
  .na-note { font-size: 0.72rem; color: var(--ink-faint); margin: 0.2rem 0 0; }

  .story-block { margin-bottom: 1.1rem; }
  .story-block:last-child { margin-bottom: 0; }
  .story-title { font-weight: 600; font-size: 0.95rem; margin: 0 0 0.3rem; }
  .story-text { font-family: var(--serif); font-size: 1.05rem; line-height: 1.6; color: var(--ink-soft); }
  .story-text p { margin: 0 0 0.6rem; }
  .story-text p:last-child { margin-bottom: 0; }

  .fast-cal-link { font-size: 0.85rem; }

  a.mini-fast {
    display: block;
    color: inherit;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  a.mini-fast:active section.card { background: #232320; }
  .mini-fast section.card { padding: 0.85rem 1rem 0.8rem; }
  .mini-fast-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0.5rem;
  }
  .mini-fast-head h2 { margin: 0 !important; }
  .mini-fast-open { font-size: 0.75rem; color: var(--accent); white-space: nowrap; }
  .mini-fast-today { font-size: 0.85rem; color: var(--ink-soft); margin: 0.55rem 0 0; }
  .mini-fast-note { font-size: 0.7rem; color: var(--ink-faint); margin: 0.35rem 0 0; }

  .reading-block { margin-bottom: 1.4rem; }
  .reading-block:last-child { margin-bottom: 0; }
  .reading-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 0 0 0.4rem;
  }
  .reading-source {
    font-weight: 400;
    font-style: italic;
    color: var(--ink-faint);
    margin-left: 0.5rem;
  }
  .reading-text {
    font-family: var(--serif);
    font-size: 1.15rem;
    line-height: 1.6;
    margin: 0;
  }

  .link-row {
    display: flex;
    gap: 1.25rem;
    flex-wrap: wrap;
    font-size: 0.95rem;
  }

  .service-select {
    width: 100%;
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 0.6rem 0.7rem;
    font-size: 1rem;
    font-family: var(--sans);
  }
  .service-text-scroll { margin-top: 0.5rem; }
  .text-switch {
    position: sticky; top: -0.8rem; z-index: 3;
    background: var(--card-bg); box-shadow: 0 -0.8rem 0 var(--card-bg);
    margin: 0 -1.25rem; padding: 0.15rem 0 0.45rem;
    border-bottom: 1px solid var(--rule);
  }
  .text-chips {
    display: flex; gap: 0.4rem; overflow-x: auto; -webkit-overflow-scrolling: touch;
    padding: 0 1.25rem; scrollbar-width: none; overscroll-behavior-x: contain;
  }
  .text-chips::-webkit-scrollbar { display: none; }
  .text-chip {
    flex-shrink: 0; appearance: none; cursor: pointer; white-space: nowrap;
    background: var(--bg); color: var(--ink-soft); border: 1px solid var(--rule); border-radius: 999px;
    padding: 0.45rem 0.85rem; font-size: 0.85rem; font-family: var(--sans);
  }
  .text-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(217, 154, 108, 0.1); font-weight: 600; }
  .text-switch-prompt { margin: 0.6rem 0 0; font-size: 0.85rem; color: var(--ink-faint); }
  .text-switch-prompt[hidden] { display: none; }
  .service-text-panel {
    max-height: calc(50vh + 192px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-color: #ffffff transparent;
  }
  .service-text-panel::-webkit-scrollbar { width: 8px; }
  .service-text-panel::-webkit-scrollbar-track { background: transparent; }
  .service-text-panel::-webkit-scrollbar-thumb {
    background-color: #ffffff;
    border-radius: 8px;
  }
  .service-text-body {
    font-family: var(--serif);
    font-size: 1.05rem;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .checkable-line {
    display: flex;
    align-items: flex-start;
    gap: 0.65rem;
    margin-bottom: 0.85rem;
    cursor: pointer;
  }
  .line-check {
    flex-shrink: 0;
    width: 1.15rem;
    height: 1.15rem;
    margin-top: 0.25rem;
    accent-color: var(--accent);
  }
  .line-text {
    font-family: var(--serif);
    font-size: 1.05rem;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .checkable-line:has(.line-check:checked) .line-text { opacity: 0.4; }
  .checkable-line.heading-line {
    cursor: default;
    margin-top: 1.1rem;
  }
  .checkable-line.heading-line .line-text {
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .checkable-line.meta-line {
    cursor: default;
  }
  .checkable-line.meta-line .line-text {
    color: var(--ink-faint);
    font-size: 0.95rem;
  }

  .checkable-header {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--card-bg);
    padding-bottom: 0.25rem;
    border-bottom: 1px solid var(--rule);
  }
  .jump-to-progress {
    appearance: none;
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 1px solid var(--rule);
    border-radius: 8px;
    color: var(--accent);
    padding: 0.45rem 0.7rem;
    margin: 0.5rem 0 0.5rem;
    font-size: 0.85rem;
    font-family: var(--sans);
    cursor: pointer;
  }
  .jump-to-progress:active { background: var(--rule); }
  .header-actions { display: flex; gap: 0.5rem; align-items: stretch; }
  .header-actions .jump-to-progress { flex: 1; }
  .add-note-btn {
    appearance: none;
    background: none;
    border: 1px solid var(--rule);
    border-radius: 8px;
    color: var(--accent);
    padding: 0.45rem 0.7rem;
    margin: 0.5rem 0;
    font-size: 0.85rem;
    font-family: var(--sans);
    cursor: pointer;
    white-space: nowrap;
  }
  .add-note-btn:active { background: var(--rule); }
  .checkable-rows .checkable-line { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .checkable-line.note-pressing { background: rgba(217, 154, 108, 0.12); border-radius: 8px; }
  .anchored-note {
    display: block;
    width: 100%;
    text-align: left;
    appearance: none;
    background: rgba(217, 154, 108, 0.08);
    border: none;
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 0.9rem;
    line-height: 1.45;
    padding: 0.45rem 0.7rem;
    margin: -0.4rem 0 0.9rem 1.8rem;
    width: calc(100% - 1.8rem);
    white-space: pre-wrap;
    cursor: pointer;
  }
  .anchored-note::before { content: "\1F4DD  "; }
  .notes-hint { font-size: 0.75rem; color: var(--ink-faint); margin: 0.6rem 0 0; }
  .anchored-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-top: 0.7rem;
    padding-top: 0.7rem;
    border-top: 1px solid var(--rule);
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  .anchored-summary[hidden] { display: none; }
  .anchored-summary .notes-doxy { width: auto; margin: 0; white-space: nowrap; flex-shrink: 0; }
  .note-sheet-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, 0.6);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .note-sheet {
    width: 100%; max-width: 640px;
    background: var(--card-bg);
    border: 1px solid var(--rule);
    border-radius: 16px 16px 0 0;
    padding: 1rem 1.1rem calc(1rem + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.6);
  }
  .note-sheet h3 { margin: 0 0 0.3rem; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; }
  .note-sheet .note-quote { font-family: var(--serif); font-size: 0.95rem; color: var(--ink-soft); margin: 0 0 0.6rem; font-style: italic; }
  .note-sheet textarea { min-height: 6rem; }
  .note-sheet-actions { display: flex; gap: 0.5rem; margin-top: 0.6rem; }
  .note-sheet-actions button {
    flex: 1; appearance: none; background: none; border: 1px solid var(--rule); border-radius: 8px;
    color: var(--ink); padding: 0.6rem; font-size: 0.9rem; font-family: var(--sans); cursor: pointer;
  }
  .note-sheet-actions .note-save { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .note-sheet-actions .note-delete { color: #e07a6e; }
  .text-search-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding-bottom: 0.5rem;
  }
  .text-search-input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 0.5rem 0.7rem;
    font-size: 0.95rem;
    font-family: var(--sans);
  }
  .text-search-count {
    font-size: 0.78rem;
    color: var(--ink-faint);
    white-space: nowrap;
    min-width: 3.5em;
    text-align: center;
  }
  .text-search-nav {
    appearance: none;
    background: none;
    border: 1px solid var(--rule);
    border-radius: 6px;
    color: var(--ink);
    padding: 0.35rem 0.55rem;
    font-size: 0.9rem;
    line-height: 1;
    cursor: pointer;
  }
  .text-search-nav:active { background: var(--rule); }
  .text-search-clear {
    appearance: none;
    background: none;
    border: 1px solid var(--rule);
    border-radius: 6px;
    color: var(--ink);
    width: 1.9rem;
    height: 1.9rem;
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }
  .text-search-clear:active { background: var(--rule); }
  .line-text mark {
    background: var(--accent);
    color: var(--bg);
    border-radius: 3px;
    padding: 0 1px;
  }
  .checkable-line.search-current {
    outline: 2px solid var(--accent);
    border-radius: 8px;
  }

  .notes-textarea {
    display: block;
    width: 100%;
    min-height: 9rem;
    resize: vertical;
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 0.6rem 0.7rem;
    font-family: var(--serif);
    font-size: 1rem;
    line-height: 1.5;
    /* White scrollbar, like the service-text scroll box (color-scheme makes
       iOS draw its overlay scroll indicator light on the dark box). */
    overflow-y: auto;
    color-scheme: dark;
    scrollbar-color: #ffffff transparent;
  }
  .notes-textarea::-webkit-scrollbar { width: 8px; }
  .notes-textarea::-webkit-scrollbar-track { background: transparent; }
  .notes-textarea::-webkit-scrollbar-thumb { background-color: #ffffff; border-radius: 8px; }

  /* Parish practice in the Divine Liturgy Full Outline (see parishPractice). */
  .parish-tag {
    display: inline-block; font-family: var(--sans, system-ui, sans-serif); font-style: normal;
    font-size: 0.66rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--accent); border: 1px solid var(--accent); border-radius: 999px;
    padding: 0.05rem 0.45rem; margin-right: 0.35rem; vertical-align: 0.12em;
  }
  .parish-rubric {
    margin: -0.35rem 0 0.9rem 1.8rem; font-family: var(--serif); font-style: italic;
    font-size: 0.98rem; line-height: 1.45; color: var(--accent);
  }
  .heading-line + .parish-rubric, .parish-rubric + .parish-rubric { margin-left: 0; }
  .heading-line + .parish-rubric { margin-top: -0.3rem; }
  .parish-rubric + .parish-rubric { margin-top: -0.5rem; }
  .line-main { display: flex; flex-direction: column; min-width: 0; }
  .choir-resp {
    font-family: var(--serif); font-style: italic; font-size: 0.95rem; color: var(--ink-faint); margin-top: 0.15rem;
  }
  .line-ref {
    align-self: flex-start; margin-top: 0.25rem; font-size: 0.8rem; color: var(--accent);
    border: 1px solid var(--rule); border-radius: 6px; padding: 0.05rem 0.4rem;
  }
  /* "The choir responds ... to each petition": its response is shown after
     every petition instead, so the instruction line itself is hidden. */
  .checkable-line.rubric-line { display: none; }
  .checkable-line.parish-title .title-sub {
    font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 0.92rem; color: var(--ink-faint); margin-top: 0.2rem;
  }
  .checkable-line.reading-title { cursor: default; margin: 0.6rem 0 0.5rem; }
  .reading-kicker {
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent);
  }
  .checkable-line.reading-title .line-text { font-weight: 600; }
  .checkable-line.reading-line { border-left: 3px solid var(--accent); padding-left: 0.6rem; margin-left: -0.2rem; }
  .reading-fill { border-left: 3px solid var(--accent); padding-left: 0.75rem; margin: 0 0 0.85rem; font-family: var(--serif); font-size: 1.05rem; line-height: 1.5; }
  .reading-fill p { margin: 0; }
  .reading-fill .reading-fill-src { font-size: 0.8rem; color: var(--ink-faint); font-style: italic; margin-bottom: 0.2rem; }
  .parish-insert { margin: 1.1rem 0 1rem; border-left: 3px solid var(--accent); padding-left: 0.75rem; }
  .parish-insert-title { font-weight: 600; letter-spacing: 0.02em; font-family: var(--serif); font-size: 1.05rem; }
  .parish-insert-text { margin: 0.35rem 0 0; }
  .parish-skip { margin: 0.2rem 0 0.9rem; }
  .parish-skip-toggle {
    appearance: none; display: block; width: 100%; text-align: left; background: transparent;
    border: 1px dashed var(--rule); border-radius: 8px; padding: 0.55rem 0.7rem; color: var(--accent);
    font-family: var(--serif); font-style: italic; font-size: 0.98rem; line-height: 1.4; cursor: pointer;
  }
  .parish-skip-show {
    display: block; margin-top: 0.2rem; font-style: normal; font-size: 0.8rem; color: var(--ink-faint);
  }
  .parish-skip-show::after { content: " \25BE"; }
  .parish-skip-toggle[aria-expanded="true"] .parish-skip-show::after { content: " \25B4"; }
  .parish-skip.collapsed .parish-skip-rows { display: none; }
  .parish-skip-rows { opacity: 0.55; margin-top: 0.7rem; }
  .notes-actions {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.6rem;
  }
  .notes-copy, .notes-text-link {
    appearance: none;
    background: none;
    border: 1px solid var(--rule);
    border-radius: 8px;
    color: var(--accent);
    padding: 0.55rem 0.7rem;
    font-size: 0.85rem;
    font-family: var(--sans);
    text-decoration: none;
    cursor: pointer;
    flex: 1;
  }
  .notes-copy:active, .notes-text-link:active, .notes-doxy:active { background: var(--rule); }
  .notes-doxy {
    appearance: none;
    display: block;
    width: 100%;
    margin-top: 0.6rem;
    background: none;
    border: 1px solid var(--accent);
    border-radius: 8px;
    color: var(--accent);
    padding: 0.55rem 0.7rem;
    font-size: 0.85rem;
    font-family: var(--sans);
    cursor: pointer;
  }
  .notes-copy-status {
    display: block;
    font-size: 0.8rem;
    color: var(--ink-faint);
    margin-top: 0.4rem;
    min-height: 1.2em;
  }

  .event-list { margin: 0; padding: 0; list-style: none; }
  .event-item { padding: 0.5rem 0; border-bottom: 1px solid var(--rule); }
  .event-item:last-child { border-bottom: none; }
  .event-item a { text-decoration: none; color: inherit; }
  .event-time { display: block; font-size: 0.8rem; color: var(--ink-faint); }
  .event-title { display: block; font-size: 1rem; }

  .prayer-group { margin-bottom: 0.75rem; }
  .prayer-group:last-child { margin-bottom: 0; }
  .prayer-group h3 {
    margin: 0 0 0.2rem;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .prayer-names { margin: 0; font-size: 0.98rem; }

  .banner {
    background: var(--warn-bg);
    color: var(--warn-ink);
    border-radius: 10px;
    padding: 0.7rem 0.9rem;
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }

  footer {
    text-align: center;
    color: var(--ink-faint);
    font-size: 0.75rem;
    margin-top: 2rem;
    line-height: 1.6;
  }

  .empty-state {
    text-align: center;

    font-family: var(--serif);

</style>
</head>
<body>
<svg id="bg-cross" viewBox="0 0 200 400" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <g class="cross-shape">
    <rect x="88" y="30" width="24" height="340"/>
    <rect x="55" y="72" width="90" height="24"/>
    <rect x="30" y="164" width="140" height="28"/>
    <rect x="48" y="268" width="104" height="24"/>
  </g>
</svg>
<main id="app">
  <div class="empty-state" id="loading">Loading today&rsquo;s brief&hellip;</div>
</main>

<script src="fasting.js"></script>
<script src="catechism.js"></script>
<script>
(function () {
  "use strict";

  var app = document.getElementById("app");
  var dayCache = {};
  var index = null;
  var fastingData = null;
  var serviceOrder = [];
  var currentDate = null;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function parseISODate(s) {
    var parts = s.split("-").map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function formatISODate(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function addDays(dateStr, n) {
    var d = parseISODate(dateStr);
    d.setDate(d.getDate() + n);
    return formatISODate(d);
  }

  function friendlyDate(dateStr) {
    var d = parseISODate(dateStr);
    var weekday = d.toLocaleDateString(undefined, { weekday: "long" });
    var rest = d.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
    return { weekday: weekday, date: rest };
  }

  function formatEventTime(sqlDateTime) {
    if (!sqlDateTime) return "";
    var iso = sqlDateTime.replace(" ", "T");
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    var isMidnight = d.getHours() === 0 && d.getMinutes() === 0;
    if (isMidnight) return "All day";
    return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  function fetchJSON(url) {
    return fetch(url, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
      return r.json();
    });
  }

  function loadIndex() {
    return fetchJSON("data/index.json").then(function (data) {
      index = data;
    });
  }

  var parish = null;
  function loadParish() {
    return fetchJSON("data/parish.json").then(function (d) { parish = d; }).catch(function () { parish = null; });
  }

  function loadDay(dateStr) {
    if (dayCache[dateStr]) return Promise.resolve(dayCache[dateStr]);
    return fetchJSON("data/days/" + dateStr + ".json").then(function (data) {
      dayCache[dateStr] = data;
      return data;
    });
  }

  function relativeStaleness(iso) {
    if (!iso) return "never";
    var then = new Date(iso).getTime();
    if (isNaN(then)) return "unknown";
    var diffH = Math.round((Date.now() - then) / 36e5);
    if (diffH < 1) return "just now";
    if (diffH < 24) return diffH + "h ago";
    var diffD = Math.round(diffH / 24);
    return diffD + "d ago";
  }

  function renderFeastSection(lit) {
    if (!lit || !lit.feasts || !lit.feasts.length) return "";
    var badge = "";
    var heading = "Recognizing";
    if (lit.great_feast) {
      heading = "Feast";
      var label = lit.great_feast.is_pascha ? "Pascha" : "Great Feast";
      badge = '<p class="great-feast-badge">&#10022; ' + esc(label) + "</p>";
    }
    return (
      "<section class=\"card\"><h2>" + esc(heading) + "</h2>" +
      badge +
      '<p class="feast-title">' +
      lit.feasts.map(esc).join(" &middot; ") +
      "</p></section>"
    );
  }

  /* A collapsible section: thin bar (title, optional one-line meta, chevron),
     collapsed by default. See wireCollapsibles(). */
  function renderCollapsible(id, title, meta, inner, extraClass, foot) {
    return (
      '<section class="card cs' + (extraClass ? " " + extraClass : "") + '" data-cs="' + esc(id) + '">' +
      '<button type="button" class="cs-bar" aria-expanded="false" aria-controls="cs-body-' + esc(id) + '">' +
      '<span class="cs-titles"><span class="cs-title">' + esc(title) + '</span><span class="cs-meta">' + (meta ? esc(meta) : "") + "</span></span>" +
      '<span class="cs-chevron" aria-hidden="true"></span></button>' +
      '<div class="cs-body" id="cs-body-' + esc(id) + '" role="region" aria-label="' + esc(title) + '" hidden>' + inner + "</div>" +
      (foot || "") +
      "</section>"
    );
  }

  function renderSaintsSection(lit) {
    if (!lit || !lit.saints || !lit.saints.length) return "";
    var summary = lit.summary_title ? '<p class="summary-title">' + esc(lit.summary_title) + "</p>" : "";
    var synaxarion = lit.synaxarion
      ? '<div class="synaxarion-panel"><div class="service-text-body">' + esc(lit.synaxarion) + "</div></div>"
      : "";
    return renderCollapsible("synaxarion", "Synaxarion · Saints Commemorated", lit.summary_title || lit.saints.slice(0, 2).join(" · "),
      summary + synaxarion + renderNewAdvent(lit));
  }

  /* Biographies from the Catholic Encyclopedia (1913) on newadvent.org,
     attached by fetch.py only when the match is unambiguous. */
  function renderNewAdvent(lit) {
    if (!lit.newadvent || !lit.newadvent.length) return "";
    var blocks = lit.newadvent.map(function (b) {
      var more = b.more && b.more.length > b.excerpt.length + 40;
      return (
        '<details class="na-bio">' +
        '<summary><span class="na-title">' + esc(b.title) + '</span>' +
        '<span class="na-excerpt">' + esc(b.excerpt) + "</span>" +
        (more ? '<span class="na-more">Read more &#9662;</span>' : "") +
        "</summary>" +
        (more ? '<div class="na-full">' + b.more.split(/\n\n+/).map(function (para) { return "<p>" + esc(para) + "</p>"; }).join("") + "</div>" +
          '<button type="button" class="na-less">Read less &#9652;</button>' : "") +
        '<a class="na-link" href="' + esc(b.url) + '" target="_blank" rel="noopener">Full article on New Advent &#8599;</a>' +
        "</details>"
      );
    }).join("");
    return (
      '<div class="na-section"><h3 class="na-heading">From the Catholic Encyclopedia (New Advent)</h3>' +
      blocks +
      '<p class="na-note">Written in 1913 from a Roman Catholic perspective; Orthodox lives of the saints may differ.</p></div>'
    );
  }

  function renderStoriesSection(lit) {
    if (!lit || !lit.stories || !lit.stories.length) return "";
    var blocks = lit.stories
      .map(function (s) {
        return (
          '<div class="story-block"><p class="story-title">' +
          esc(s.title) +
          '</p><div class="story-text">' +
          s.html +
          "</div></div>"
        );
      })
      .join("");
    return '<section class="card"><h2>About Today&rsquo;s Saints</h2>' + blocks + "</section>";
  }

  /* Compact current-month fasting calendar shown at the top of the brief.
     Tapping it opens the full calendar (fasting.html) in a new tab. */
  function renderMiniFastingCalendar(dateStr) {
    if (!fastingData || !window.Fasting) return "";
    var F = window.Fasting;
    var y = +dateStr.slice(0, 4), m = +dateStr.slice(5, 7);
    var info = F.dayInfo(fastingData, dateStr);
    if (!info.covered) return "";
    var today = F.todayCentral();
    var who = dateStr === today ? "Today" : "This day";
    var line = info.levelInfo
      ? who + ": <strong>" + F.esc(info.levelInfo.label) + "</strong>"
      : info.fastFree ? who + ": fast-free" : who + ": no fast";
    var context = info.season ? info.season.name : info.fastFree ? info.fastFree.name.replace(/^Fast-free: /, "") : "";
    if (context) line += " &middot; " + F.esc(context);
    var levels = F.levelsInMonth(fastingData, y, m);
    var href = "fasting.html?m=" + y + "-" + F.pad(m) + "&d=" + dateStr;
    return (
      '<a class="mini-fast" href="' + href + '" target="_blank" rel="opener" aria-label="Open the full fasting calendar">' +
      '<section class="card"><div class="mini-fast-head"><h2>Fasting &middot; ' + F.MONTHS[m - 1] + " " + y + "</h2>" +
      '<span class="mini-fast-open">Full calendar &#8599;</span></div>' +
      F.monthGrid(fastingData, y, m, { today: today, selected: dateStr, compact: true }) +
      F.legend(fastingData, levels, { free: F.hasFastFree(fastingData, y, m), today: true }) +
      '<p class="mini-fast-today">' + line + "</p>" +
      (info.provisional ? '<p class="mini-fast-note">Provisional &mdash; the Archdiocese hasn&rsquo;t published this year&rsquo;s calendar yet.</p>' : "") +
      "</section></a>"
    );
  }

  function renderReadingSection(lit) {
    if (!lit || !lit.readings || !lit.readings.length) return "";
    var blocks = lit.readings
      .map(function (r) {
        var source = r.source_label ? '<span class="reading-source">from ' + esc(r.source_label) + "</span>" : "";
        return (
          '<div class="reading-block"><p class="reading-label">' +
          esc(r.display) +
          source +
          '</p><p class="reading-text">' +
          esc(r.text) +
          "</p></div>"
        );
      })
      .join("");
    var meta = lit.readings.map(function (r) { return r.display; }).join(" · ");
    return renderCollapsible("readings", "Daily Bible Readings", meta, blocks);
  }

  function renderTextChooser(groupId, items) {
    if (!items || !items.length) return "";
    // A row of chips (scrolls sideways if it doesn't fit), pinned at the top of
    // the section's scroll box so she can switch texts from anywhere in one.
    var chips = items
      .map(function (it, i) {
        return '<button type="button" class="text-chip" role="tab" aria-selected="false" data-group="' + esc(groupId) +
          '" data-index="' + i + '">' + esc(it.label) + "</button>";
      })
      .join("");
    var panels = items
      .map(function (it, i) {
        var body = it.html
          ? it.html
          : it.text
          ? '<div class="service-text-body">' + esc(it.text) + "</div>"
          : '<div class="service-text-body">' +
            '<p>Text isn&rsquo;t available inline for this one.</p>' +
            (it.pdf_url ? '<a href="' + esc(it.pdf_url) + '" target="_blank" rel="noopener">Open PDF &rarr;</a>' : "") +
            "</div>";
        return '<div class="service-text-panel" data-group="' + esc(groupId) + '" data-index="' + i + '" hidden>' + body + "</div>";
      })
      .join("");
    return (
      '<div class="text-switch" data-group="' + esc(groupId) + '"><div class="text-chips" role="tablist" aria-label="Choose a text">' + chips + "</div></div>" +
      '<p class="text-switch-prompt" data-group="' + esc(groupId) + '">Tap a text above to open it.</p>' +
      '<div class="service-text-scroll">' + panels + "</div>"
    );
  }

  function isHeadingLine(p) {
    return !/[a-z]/.test(p) && /[A-Z]/.test(p);
  }

  var SPEAKER_TAG_PATTERN = /^(priest|deacon|reader|people|choir|all|bishop|subdeacon|metropolitan)\s*:/i;

  // The first few lines of a service text are usually a title/date/commemorations
  // preamble, not anything actually said in the service. That preamble ends at
  // the first heading or the first line spoken by someone.
  function countPreambleLines(paragraphs) {
    var cap = Math.min(paragraphs.length, 8);
    for (var i = 0; i < cap; i++) {
      if (isHeadingLine(paragraphs[i]) || SPEAKER_TAG_PATTERN.test(paragraphs[i])) return i;
    }
    return 0;
  }

  /* ---- Parish practice (Divine Liturgy Full Outline) --------------------
     Aimee's notes from attending Liturgy at her parish, applied to the Full
     Outline every day it appears. This never adds liturgical text: it only
     re-styles existing lines (title / instruction / reading), hides blocks
     behind a toggle, repeats the choir response the book itself names after
     each petition, and adds short "Our parish" rubrics in her words.
     Paragraph indexes are untouched, so saved progress and pinned notes
     still line up. */
  var GOSPEL_BOOK_RE = /^(st\.?\s*)?(matthew|mark|luke|john)\b/i;
  function startsWithCI(p, prefix) { return p.toLowerCase().indexOf(prefix.toLowerCase()) === 0; }
  function findPara(paras, prefix, from) {
    for (var i = from || 0; i < paras.length; i++) if (startsWithCI(paras[i], prefix)) return i;
    return -1;
  }
  function verseSig(s) { var m = /[0-9]+:[0-9]+/.exec(s || ""); return m ? m[0] : null; }
  function isFallbackPara(p) { return /^\(See the parish bulletin/i.test(p); }

  function parishPractice(label, paras, lit) {
    var pp = { rows: {}, skips: [] };
    if (!/full outline/i.test(label || "")) return pp;
    function row(i) { return pp.rows[i] || (pp.rows[i] = { after: [] }); }
    var readings = (lit && lit.readings) || [];
    function matchReading(ref) {
      var sig = verseSig(ref);
      if (!sig) return null;
      return readings.filter(function (r) { return verseSig(r.display) === sig; })[0] || null;
    }

    // 1-2. Epistle and Gospel laid out as readings, with their titles shown
    // where the reader / deacon announces them.
    function reading(kicker, introPrefix, endPrefix, announcePrefix, pickFallback, rubric) {
      var intro = findPara(paras, introPrefix);
      if (intro < 0) return;
      var t = intro + 1, end = findPara(paras, endPrefix, t);
      if (t >= paras.length || end < 0 || end - t > 12) return;
      var ref = paras[t], fill = null;
      if (isFallbackPara(paras[t])) {
        fill = pickFallback();
        if (!fill) return;
        ref = fill.display;
        row(t).mode = "reading-title"; row(t).kicker = kicker; row(t).display = ref; row(t).fill = fill.text;
      } else {
        var r = matchReading(ref);
        if (r) ref = r.display;
        row(t).mode = "reading-title"; row(t).kicker = kicker; row(t).display = ref;
        for (var i = t + 1; i < end; i++) row(i).mode = "reading";
      }
      if (rubric) row(end - 1).after.push(rubric);
      var ann = findPara(paras, announcePrefix);
      if (ann >= 0 && ann < t) row(ann).ref = ref;
    }
    reading("The Epistle", "The reader chants the appointed epistle", "PRIEST: Peace be to thee that readest",
      "READER: (says the title of the epistle)",
      function () { return readings.filter(function (r) { return r.text && !GOSPEL_BOOK_RE.test(r.display || ""); })[0]; }, null);
    reading("The Gospel", "DEACON: Let us attend. (and he chants the appointed lection)", "PRIEST: Peace be to thee that proclaimest",
      "DEACON: The reading from the holy gospel according to",
      function () { return readings.filter(function (r) { return r.text && GOSPEL_BOOK_RE.test(r.display || ""); })[0]; },
      "The Gospel is read in English, then in Arabic.");

    // 3. The homily is a section title, not a checkbox.
    var hom = findPara(paras, "The priest preaches the homily");
    if (hom >= 0) { row(hom).mode = "title"; row(hom).display = "THE HOMILY"; }

    // 7. Prayer for the catechumens: skipped here.
    var cat = findPara(paras, "PRAYER FOR THE CATECHUMENS");
    if (cat >= 0) {
      var catEnd = cat + 1;
      while (catEnd < paras.length && !isHeadingLine(paras[catEnd])) catEnd++;
      if (catEnd - 1 > cat) pp.skips.push({ start: cat + 1, end: catEnd - 1, label: "Skipped at our parish (done during the Great Entrance)" });
    }

    // 8-9. "The choir responds X to each petition" is an instruction, not a
    // line to check off; the response goes after each petition instead.
    paras.forEach(function (p, i) {
      var m = /^The choir responds (.+?) to (this and the following|each) petitions?(?: until noted)?\.?$/i.exec(p);
      if (!m) return;
      var resp = "Choir: " + m[1].replace(/[.\s]+$/, "") + ".";
      row(i).mode = "instruction";
      var prev = i - 1;
      if (prev >= 0 && !isHeadingLine(paras[prev]) && (m[2].toLowerCase() !== "each" ? !SPEAKER_TAG_PATTERN.test(paras[prev]) : /^deacon\s*:/i.test(paras[prev]))) {
        row(prev).resp = resp;
      }
      for (var j = i + 1; j < paras.length; j++) {
        var q = paras[j];
        if (isHeadingLine(q) || SPEAKER_TAG_PATTERN.test(q) || /^The choir responds/i.test(q)) break;
        if (j + 1 < paras.length && /^choir\s*:/i.test(paras[j + 1])) break; // has its own response line
        row(j).resp = resp;
      }
    });

    // 10-14. Short parish rubrics.
    var bow = findPara(paras, "PRIEST: The grace of our Lord Jesus Christ and the love of God the Father");
    if (bow >= 0) row(bow).after.push("We bow.");
    var hearts = findPara(paras, "PRIEST: Let us lift up our hearts");
    if (hearts >= 0) row(hearts).after.push("We hold out our hands.");
    var epi = paras.indexOf("THE EPICLESIS");
    if (epi >= 0) {
      row(epi).after.push("The people say many of the deacon\u2019s responses here, mostly the Amens.");
      row(epi).after.push("The offering is collected during the Epiclesis.");
    }
    var ofa = paras.indexOf("THE OUR FATHER");
    if (ofa >= 0) row(ofa).after.push("We hold out our hands. Said in English, then in Arabic.");

    // 15. The fraction dialogue isn't said aloud here.
    var dv = findPara(paras, "DEACON: Divide, master, the holy bread");
    var dvEnd = dv >= 0 ? findPara(paras, "DEACON: The warmth of the Holy Spirit", dv) : -1;
    if (dv >= 0 && dvEnd >= dv && dvEnd - dv < 15) pp.skips.push({ start: dv, end: dvEnd, label: "Not said aloud at our parish" });
    return pp;
  }

  /* The parish's own apolytikion (data/parish.json), sung every Sunday at
     the Little Entrance after the day's apolytikia and before the kontakion.
     Not added when the day's texts already have it (their feast, May 21). */
  var PARISH_APOLY_PRESENT_RE = /apolytikion\s+(?:of|for)\s+(?:ss|sts|saints)\.?\s+constantine\s+and\s+helen|Constantine who is Thine Apostle/i;
  function parishApolytikionFor(lit, dateStr) {
    var cfg = parish && parish.sunday_apolytikion;
    if (!cfg || !cfg.text || parseISODate(dateStr).getDay() !== 0) return null;
    var present = (lit.service_texts || []).some(function (s) { return PARISH_APOLY_PRESENT_RE.test(s.text || ""); });
    return present ? null : cfg;
  }
  // Index of the paragraph the parish apolytikion goes after, or -1.
  function parishApolytikionSlot(label, paras) {
    if (!/divine liturgy/i.test(label || "")) return -1;
    var i;
    if (/full outline/i.test(label)) {
      // After the apolytikia the choir chants following the eisodikon,
      // before the thrice-holy prayer line and the kontakion.
      var start = findPara(paras, "Then, the choir chants the appointed apolytikia");
      if (start < 0) return -1;
      for (i = start + 1; i < paras.length; i++) {
        if (/^The priest says the prayer of the thrice-holy hymn/i.test(paras[i]) || /^The clergy then chant the appointed kontakion/i.test(paras[i])) return i - 1;
        if (isHeadingLine(paras[i])) return -1;
      }
      return -1;
    }
    // Variables: right after "Now sing the apolytikion of the patron saint
    // or feast of the temple", else after the last apolytikion before the
    // first kontakion.
    for (i = 0; i < paras.length; i++) if (/apolytikion of the patron saint/i.test(paras[i])) return i;
    var lastApoly = -1;
    for (i = 0; i < paras.length; i++) {
      if (/^KONTAKION\b/.test(paras[i])) return lastApoly >= 0 ? i - 1 : -1;
      if (isHeadingLine(paras[i]) && /APOLYTIKION/.test(paras[i])) lastApoly = i;
    }
    return -1;
  }
  function parishApolytikionHtml(cfg) {
    return '<div class="parish-insert"><div class="parish-insert-head"><span class="parish-tag">Our parish</span> <span class="parish-insert-title">' + esc(cfg.heading) +
      '</span></div><p class="parish-insert-text"><span class="line-text">' + esc(cfg.text) + "</span></p></div>";
  }

  function parishRubricHtml(text) {
    return '<div class="parish-rubric"><span class="parish-tag">Our parish</span> <span class="parish-rubric-text">' + esc(text) + "</span></div>";
  }

  function renderCheckableBody(text, storageKey, serviceLabel, lit, apoly) {
    var paragraphs = text.split(/\n+/).map(function (p) { return p.trim(); }).filter(Boolean);
    var apolySlot = apoly ? parishApolytikionSlot(serviceLabel, paragraphs) : -1;
    var preambleCount = countPreambleLines(paragraphs);
    var pp = parishPractice(serviceLabel, paragraphs, lit);
    function rowHtml(p, i) {
      var r = pp.rows[i] || { after: [] };
      var after = r.after.map(parishRubricHtml).join("");
      if (i < preambleCount) {
        return '<div class="checkable-line meta-line" data-para="' + i + '"><span class="line-text">' + esc(p) + "</span></div>";
      }
      if (r.mode === "title") {
        return '<div class="checkable-line heading-line parish-title" data-para="' + i + '"><span class="line-main"><span class="line-text">' + esc(r.display) + '</span><span class="title-sub">' + esc(p) + "</span></span></div>" + after;
      }
      if (r.mode === "instruction") {
        return '<div class="checkable-line rubric-line" data-para="' + i + '"><span class="line-text">' + esc(p) + "</span></div>" + after;
      }
      if (r.mode === "reading-title") {
        return '<div class="checkable-line reading-title" data-para="' + i + '"><span class="line-main"><span class="reading-kicker">&#x1F4D6; ' + esc(r.kicker) + '</span><span class="line-text">' + esc(r.display) + "</span></span></div>" +
          (r.fill ? '<div class="reading-fill"><p class="reading-fill-src">From today&rsquo;s readings</p><p>' + esc(r.fill) + "</p></div>" : "") + after;
      }
      if (isHeadingLine(p)) {
        return '<div class="checkable-line heading-line" data-para="' + i + '"><span class="line-text">' + esc(p) + "</span></div>" + after;
      }
      var extra = (r.resp ? '<span class="choir-resp">' + esc(r.resp) + "</span>" : "") + (r.ref ? '<span class="line-ref">' + esc(r.ref) + "</span>" : "");
      return (
        '<label class="checkable-line' + (r.mode === "reading" ? " reading-line" : "") + '" data-para="' + i + '">' +
        '<input type="checkbox" class="line-check" data-index="' + i + '">' +
        (extra ? '<span class="line-main"><span class="line-text">' + esc(p) + "</span>" + extra + "</span>" : '<span class="line-text">' + esc(p) + "</span>") +
        "</label>" + after
      );
    }
    var html = [];
    for (var i = 0; i < paragraphs.length; i++) {
      var sk = pp.skips.filter(function (s) { return s.start === i; })[0];
      if (sk) {
        var inner = [];
        for (var j = sk.start; j <= sk.end; j++) inner.push(rowHtml(paragraphs[j], j));
        html.push(
          '<div class="parish-skip collapsed">' +
          '<button type="button" class="parish-skip-toggle" aria-expanded="false">' +
          '<span class="parish-tag">Our parish</span> <span class="parish-rubric-text">' + esc(sk.label) + '</span><span class="parish-skip-show">Show text</span></button>' +
          '<div class="parish-skip-rows">' + inner.join("") + "</div></div>"
        );
        i = sk.end;
        continue;
      }
      html.push(rowHtml(paragraphs[i], i));
      if (i === apolySlot) html.push(parishApolytikionHtml(apoly));
    }
    var rows = html.join("");
    return (
      '<div class="checkable-body" data-storage-key="' + esc(storageKey) + '" data-service="' + esc(serviceLabel || "") + '">' +
      '<div class="checkable-header">' +
      '<div class="header-actions">' +
      '<button type="button" class="jump-to-progress" aria-label="Jump to last checked line">&#8617; Resume where I left off</button>' +
      '<button type="button" class="add-note-btn" aria-label="Add a note at the top visible line">&#xFF0B; Note</button>' +
      "</div>" +
      '<div class="text-search-bar">' +
      '<input type="text" class="text-search-input" placeholder="Search this text&hellip;" autocomplete="off" autocapitalize="off">' +
      '<button type="button" class="text-search-clear" aria-label="Clear search" hidden>&times;</button>' +
      '<span class="text-search-count"></span>' +
      '<button type="button" class="text-search-nav" data-dir="-1" aria-label="Previous match">&uarr;</button>' +
      '<button type="button" class="text-search-nav" data-dir="1" aria-label="Next match">&darr;</button>' +
      "</div>" +
      "</div>" +
      '<div class="checkable-rows">' + rows + "</div>" +
      "</div>"
    );
  }

  function renderServiceLinksSection(lit, dateStr) {
    if (!lit || !lit.service_texts || !lit.service_texts.length) return "";
    var apoly = parishApolytikionFor(lit, dateStr);
    var items = lit.service_texts.map(function (s) {
      if (!s.text) return s;
      var storageKey = "serviceProgress:" + dateStr + ":" + s.label;
      return { label: s.label, html: renderCheckableBody(s.text, storageKey, s.label, lit, apoly) };
    });
    serviceOrder = lit.service_texts.map(function (s) { return s.label; });
    return renderCollapsible("services", "Service Texts", lit.service_texts.map(function (s) { return s.label; }).join(" · "),

  function renderNotesSection(dateStr) {

    return (

  function renderEventsSection(day) {
    if (!day.events || !day.events.length) return "";

      .map(function (ev) {

        return (

          (ev.url ? '<a href="' + esc(ev.url) + '" target="_blank" rel="noopener">' + body + "</a>" : body) +

    return renderCollapsible("events", "Parish Events Today", meta,
      '<ul class="event-list">' + items +
      '</ul><p class="fast-cal-link" style="margin-top:0.6rem"><a href="' +
      esc(index.links.parish_calendar) +

  }

  function renderPrayerListSection() {
    var pl = index.prayer_list;
    if (!pl) return "";
    var groups = [
      { key: "sick", label: "For the health of body and soul" },

    var body = groups
      .map(function (g) {
        var names = pl[g.key];

        return (
          '<div class="prayer-group"><h3>' +
          esc(g.label) +
          '</h3><p class="prayer-names">' +
          names.map(esc).join(", ") +

        );
      })
      .join("");
    if (!body) return "";
    var total = groups.reduce(function (n, g) { return n + ((pl[g.key] || []).length); }, 0);
    var meta = total + " names · " + groups.filter(function (g) { return pl[g.key] && pl[g.key].length; })
      .map(function (g) { return { sick: "Health", military: "Armed forces", catechumens: "Catechumens" }[g.key]; }).join(" · ");
    return renderCollapsible("prayer", "Prayer List", meta, body);
  }

  function renderStalenessBanners() {
    var s = index.status || {};
    var messages = [];
    if (!s.liturgical_ok) messages.push("Couldn&rsquo;t reach the liturgical calendar this morning &mdash; showing the most recent data available.");
    if (!s.parish_events_ok) messages.push("Couldn&rsquo;t reach the parish calendar this morning &mdash; events shown may be out of date.");
    if (!s.bulletin_ok) messages.push("Couldn&rsquo;t find a new bulletin &mdash; linking to the last known one.");
    if (s.fasting_data_ok === false) messages.push("Couldn&rsquo;t refresh the fasting calendar &mdash; showing the last known one.");
    if (!s.prayer_list_ok) messages.push("Couldn&rsquo;t read the prayer list from the bulletin &mdash; showing the last known list.");
    if (!messages.length) return "";

  function renderFooter() {

    return (
      "<footer>Liturgical data updated " +
      esc(relativeStaleness(ls.liturgical)) +

      esc(relativeStaleness(index.generated_at)) +

    );
